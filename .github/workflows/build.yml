name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run tests
        working-directory: tests
        run: npx playwright test

  build-windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    permissions:
      contents: write # let the release step create/update releases
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm ci
      - name: Build app and installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMarkdownReader-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMarkdownReader-portable
          path: src-tauri/target/release/simple-markdown-reader.exe
          if-no-files-found: error
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
