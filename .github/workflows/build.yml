name: CI

# Verification only. Publishing lives in release.yml, triggered by a version
# tag, so there is exactly one path that can produce a release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The version is declared five times at six sites and only ONE of them
      # was ever read -- by release.yml, at tag time. Everything before a tag
      # checked none of them, so five could drift for weeks and the first sign
      # would be a release whose installer is named after a different version
      # than the app reports. Needs no dependencies, so it runs first.
      - name: The version declarations agree
        run: node scripts/check-versions.mjs
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run tests
        working-directory: tests
        run: npx playwright test

  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm ci
      - name: Build app and installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Glance-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Glance-portable
          path: src-tauri/target/release/glance.exe
          if-no-files-found: error
