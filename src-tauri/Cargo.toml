[package]
name = "glance"
version = "0.4.1"
description = "Glance — fast, minimal Markdown reader and editor"
authors = ["DSI Innovations"]
license = "0BSD"
repository = "https://github.com/MoogMan1073/Glance"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

# Small binary, fast startup.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
