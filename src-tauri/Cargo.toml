[package]
name = "simple-markdown-reader"
version = "1.0.0"
description = "Fast, minimal Markdown reader and editor"
authors = ["MoogMan1073"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Small binary, fast startup.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
