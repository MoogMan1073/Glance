<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glance</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/hljs-github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="vendor/hljs-github-dark.min.css" id="hljs-dark" disabled />
</head>
<body data-view="read" data-theme="light">

  <header id="toolbar">
    <div class="tb-group">
      <button class="tb-btn" id="btn-new" title="New (Ctrl+N)" aria-label="New file">
        <svg viewBox="0 0 16 16"><path d="M9 1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5L9 1zm0 1.5L11.5 5H9V2.5zM4 2h4v4h4v8H4V2z"/></svg>
      </button>
      <button class="tb-btn" id="btn-open" title="Open (Ctrl+O)" aria-label="Open file">
        <svg viewBox="0 0 16 16"><path d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.1a1.5 1.5 0 0 1 1.06.44L8.7 3.5H13A1.5 1.5 0 0 1 14.5 5v.5H3.3a1.8 1.8 0 0 0-1.73 1.3L1.5 7.2V3zm.35 4.9a.8.8 0 0 1 .77-.58h11.53a.8.8 0 0 1 .77 1.02l-1.5 5.25a1.5 1.5 0 0 1-1.44 1.09H2.5A1.5 1.5 0 0 1 1 13.17l.85-5.27z"/></svg>
      </button>
      <button class="tb-btn" id="btn-save" title="Save (Ctrl+S)" aria-label="Save file">
        <svg viewBox="0 0 16 16"><path d="M2 3a1 1 0 0 1 1-1h8.6a1 1 0 0 1 .7.3l1.4 1.4a1 1 0 0 1 .3.7V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3zm3-.5v3h6v-3H5zm4 .75h1.25v1.5H9v-1.5zM4.5 13.5h7V9h-7v4.5z"/></svg>
      </button>
      <button class="tb-btn" id="btn-saveas" title="Save As… (Ctrl+Shift+S)" aria-label="Save file as">
        <svg viewBox="0 0 16 16"><path d="M2 3a1 1 0 0 1 1-1h8.6a1 1 0 0 1 .7.3l1.4 1.4a1 1 0 0 1 .3.7V8h-1.5V4.1l-.9-.6H5v3H4V2.9L3.5 3v10.5H7V15H3a1 1 0 0 1-1-1V3zm10.9 6.2a.75.75 0 0 1 1.06 0l1.3 1.3a.75.75 0 0 1 0 1.06l-3.9 3.94-2.1.5a.4.4 0 0 1-.49-.48l.5-2.1 3.63-4.22z"/></svg>
      </button>
    </div>

    <div class="tb-sep edit-only"></div>

    <div class="tb-group edit-only">
      <select id="sel-heading" class="tb-select" title="Paragraph style (Ctrl+Alt+0–6)" aria-label="Paragraph style">
        <option value="0">Paragraph</option>
        <option value="1">Heading 1</option>
        <option value="2">Heading 2</option>
        <option value="3">Heading 3</option>
        <option value="4">Heading 4</option>
        <option value="5">Heading 5</option>
        <option value="6">Heading 6</option>
      </select>
      <button class="tb-btn tb-txt" id="btn-bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
      <button class="tb-btn tb-txt" id="btn-italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
      <button class="tb-btn tb-txt" id="btn-strike" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough"><s>S</s></button>
      <button class="tb-btn tb-txt" id="btn-mark" title="Highlight (Ctrl+Shift+H)" aria-label="Highlight"><span class="hl">H</span></button>
      <button class="tb-btn" id="btn-code" title="Inline code (Ctrl+E)" aria-label="Inline code">
        <svg viewBox="0 0 16 16"><path d="M5.7 3.7 1.4 8l4.3 4.3 1.06-1.06L3.52 8l3.24-3.24L5.7 3.7zm4.6 0-1.06 1.06L12.48 8l-3.24 3.24 1.06 1.06L14.6 8l-4.3-4.3z"/></svg>
      </button>
      <button class="tb-btn" id="btn-codeblock" title="Code block (Ctrl+Shift+C)" aria-label="Code block">
        <svg viewBox="0 0 16 16"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h9A1.5 1.5 0 0 1 14 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-11zM3.5 2.5v11h9v-11h-9zM6.8 6 5 8l1.8 2 .9-.8L6.6 8l1.1-1.2L6.8 6zm2.4 0-.9.8L9.4 8l-1.1 1.2.9.8L11 8 9.2 6z"/></svg>
      </button>
    </div>

    <div class="tb-sep edit-only"></div>

    <div class="tb-group edit-only">
      <button class="tb-btn" id="btn-link" title="Link (Ctrl+K)" aria-label="Insert link">
        <svg viewBox="0 0 16 16"><path d="M6.5 4.4 8.6 2.3a3 3 0 0 1 4.24 0l.86.86a3 3 0 0 1 0 4.24l-2.1 2.1a3 3 0 0 1-1.86.87l.9-1.87 1.99-2.16a1.5 1.5 0 0 0 0-2.12l-.85-.85a1.5 1.5 0 0 0-2.12 0L7.55 5.5l-1.05-1.1zm3 7.2-2.1 2.1a3 3 0 0 1-4.24 0l-.86-.86a3 3 0 0 1 0-4.24l2.1-2.1a3 3 0 0 1 1.86-.87l-.9 1.87-1.99 2.16a1.5 1.5 0 0 0 0 2.12l.85.85a1.5 1.5 0 0 0 2.12 0l2.12-2.12 1.04 1.09zM10.6 4.34 5.4 9.54l1.06 1.06 5.2-5.2-1.06-1.06z"/></svg>
      </button>
      <button class="tb-btn" id="btn-image" title="Image" aria-label="Insert image">
        <svg viewBox="0 0 16 16"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9zm1.5 0v6.1l2.3-2.3a1 1 0 0 1 1.4 0l1.8 1.8 1.3-1.3a1 1 0 0 1 1.4 0l1.8 1.8V3.5h-11zm11 9v-.28l-2.5-2.5-1.3 1.3 1.42 1.48h2.38zm-4.46 0L6.5 8.96 3.5 12v.5h6.54zM10 5a1.2 1.2 0 1 1 0 2.4A1.2 1.2 0 0 1 10 5z"/></svg>
      </button>
      <button class="tb-btn" id="btn-quote" title="Blockquote (Ctrl+Shift+Q)" aria-label="Blockquote">
        <svg viewBox="0 0 16 16"><path d="M3.5 4A2.5 2.5 0 0 0 1 6.5c0 1.2.85 2.2 2 2.44-.14.9-.62 1.75-1.4 2.31l.9 1.15C4.1 11.2 5 9.6 5 7.75V6.5A1.5 1.5 0 0 0 3.5 4zm7 0A2.5 2.5 0 0 0 8 6.5c0 1.2.85 2.2 2 2.44-.14.9-.62 1.75-1.4 2.31l.9 1.15c1.6-1.2 2.5-2.8 2.5-4.65V6.5A1.5 1.5 0 0 0 10.5 4z" transform="translate(1.5 0)"/></svg>
      </button>
      <button class="tb-btn" id="btn-ul" title="Bulleted list (Ctrl+Shift+8)" aria-label="Bulleted list">
        <svg viewBox="0 0 16 16"><path d="M3 3.25a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 .25h8v1.5H6V3.5zM3 7a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 .25h8v1.5H6v-1.5zM3 10.75a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 .25h8v1.5H6V11z"/></svg>
      </button>
      <button class="tb-btn" id="btn-ol" title="Numbered list (Ctrl+Shift+7)" aria-label="Numbered list">
        <svg viewBox="0 0 16 16"><path d="M2.4 2.2h1.1v3.1H2.4V3.4l-.8.3-.3-.9 1.1-.6zM6 3.5h8V5H6V3.5zm0 3.75h8v1.5H6v-1.5zM6 11h8v1.5H6V11zM1.5 8.1c0-.9.7-1.4 1.5-1.4s1.5.5 1.5 1.3c0 .5-.3.9-.7 1.3l-.8.7h1.5v.9h-3v-.8L2.9 8.7c.3-.3.5-.5.5-.7 0-.3-.2-.4-.4-.4-.3 0-.5.2-.5.5h-1zm.1 4.1h2.8v.8l-.9.7c.6.1 1 .5 1 1.1 0 .8-.7 1.3-1.6 1.3-.7 0-1.2-.3-1.5-.7l.7-.6c.2.3.4.4.8.4.3 0 .6-.1.6-.4s-.3-.4-.7-.4h-.5v-.7l1-.8H1.6v-.7z" transform="translate(0 -1.1)"/></svg>
      </button>
      <button class="tb-btn" id="btn-task" title="Checkbox list (Ctrl+Shift+9)" aria-label="Checkbox list">
        <svg viewBox="0 0 16 16"><path d="M2.5 2h4A.5.5 0 0 1 7 2.5v4a.5.5 0 0 1-.5.5h-4A.5.5 0 0 1 2 6.5v-4a.5.5 0 0 1 .5-.5zM3 3v3h3V3H3zm-.5 6.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5zM3 10.5v3h3v-3H3zm1.1 2.5L3 11.9l.6-.6.5.5 1.3-1.3.6.6L4.1 13zM9 3.5h5V5H9V3.5zM9 11h5v1.5H9V11z"/></svg>
      </button>
      <button class="tb-btn" id="btn-table" title="Table" aria-label="Insert table">
        <svg viewBox="0 0 16 16"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9zM3.5 6h9V3.5h-9V6zm4 1.5h-4v2h4v-2zm1.5 0v2h3.5v-2H9zm-1.5 3.5h-4v1.5h4V11zm1.5 1.5h3.5V11H9v1.5z"/></svg>
      </button>
      <button class="tb-btn" id="btn-hr" title="Horizontal rule" aria-label="Horizontal rule">
        <svg viewBox="0 0 16 16"><path d="M2 7.25h12v1.5H2v-1.5z"/></svg>
      </button>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group" id="view-switch" role="group" aria-label="View mode">
      <button class="tb-btn tb-view" id="btn-view-edit" title="Edit view (Ctrl+1)" aria-label="Edit view">
        <svg viewBox="0 0 16 16"><path d="M11.1 2.2a1.9 1.9 0 0 1 2.7 2.7l-7.9 7.9-3.4.7.7-3.4 7.9-7.9zM10 4.4 4.5 9.9l-.3 1.9 1.9-.3L11.6 6 10 4.4zm2.6-1.1a.4.4 0 0 0-.55 0l-.98.97 1.6 1.6.97-.98a.4.4 0 0 0 0-.55l-1.04-1.04z"/></svg>
        <span>Edit</span>
      </button>
      <button class="tb-btn tb-view" id="btn-view-split" title="Side-by-side view (Ctrl+2)" aria-label="Side-by-side view">
        <svg viewBox="0 0 16 16"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9zm5.25 0H3.5v9h3.75v-9zm1.5 9h3.75v-9H8.75v9z"/></svg>
        <span>Split</span>
      </button>
      <button class="tb-btn tb-view" id="btn-view-read" title="Display view (Ctrl+3)" aria-label="Display view">
        <svg viewBox="0 0 16 16"><path d="M8 3C4.5 3 1.7 5.1.5 8c1.2 2.9 4 5 7.5 5s6.3-2.1 7.5-5C14.3 5.1 11.5 3 8 3zm0 8.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7zM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        <span>Read</span>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button class="tb-btn" id="btn-theme" title="Theme: System (Ctrl+Shift+D)" aria-label="Toggle theme"></button>
      <button class="tb-btn" id="btn-help" title="Help (F1)" aria-label="Help">
        <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm.05 2.3c-1.2 0-2.1.65-2.45 1.7l1.3.45c.16-.5.55-.8 1.1-.8.55 0 .95.33.95.8 0 .43-.23.65-.85 1.08-.65.45-1.03.93-1.03 1.72v.3h1.4v-.22c0-.5.2-.72.85-1.16.7-.48 1.13-1.03 1.13-1.8 0-1.2-1-2.07-2.4-2.07zM8 10.9a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8z"/></svg>
      </button>
    </div>
  </header>

  <nav id="tabbar" role="tablist" aria-label="Open documents"></nav>

  <main id="main">
    <!-- One textarea per open document, created by app.js. Each keeps its own
         native undo stack and scroll position; the active one carries id="editor". -->
    <section id="editorPane"></section>
    <section id="previewPane" tabindex="-1">
      <article id="preview" class="markdown-body" aria-label="Rendered Markdown"></article>
    </section>
  </main>

  <div id="helpOverlay" hidden>
    <div id="helpPanel" role="dialog" aria-modal="true" aria-label="Help" tabindex="-1">
      <header id="helpHeader">
        <span>Help — Markdown &amp; Shortcuts</span>
        <button class="tb-btn" id="btn-help-close" title="Close (Esc)" aria-label="Close help">
          <svg viewBox="0 0 16 16"><path d="M4.1 3 8 6.9 11.9 3 13 4.1 9.1 8l3.9 3.9-1.1 1.1L8 9.1 4.1 13 3 11.9 6.9 8 3 4.1 4.1 3z"/></svg>
        </button>
      </header>
      <article id="helpContent" class="markdown-body"></article>
    </div>
  </div>

  <div id="tabMenu" role="menu" hidden></div>

  <div id="toast" hidden></div>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/markdown-it-task-lists.min.js"></script>
  <script src="vendor/markdown-it-footnote.min.js"></script>
  <script src="vendor/markdown-it-deflist.min.js"></script>
  <script src="vendor/markdown-it-mark.min.js"></script>
  <script src="vendor/markdown-it-sub.min.js"></script>
  <script src="vendor/markdown-it-sup.min.js"></script>
  <script src="vendor/markdown-it-emoji.min.js"></script>
  <script src="vendor/markdown-it-attrs.browser.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
